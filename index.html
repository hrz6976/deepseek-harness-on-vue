<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek Harness on Vue</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; }
  body { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: #0f1115; color: #d7dce3; margin: 0; padding: 20px; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { color: #8a93a3; font-size: 12px; margin-bottom: 16px; }
  .layout { display: grid; grid-template-columns: 1fr 340px; gap: 16px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: #171b22; border: 1px solid #262c37; border-radius: 8px; padding: 14px; margin-bottom: 14px; }
  .panel h2 { font-size: 12px; color: #8a93a3; margin: 0 0 10px; text-transform: uppercase; letter-spacing: 1px; }
  input[type=text], input[type=password], textarea { width: 100%; background: #0f1115; border: 1px solid #333c4a; border-radius: 6px; color: #d7dce3; padding: 8px 10px; font: inherit; font-size: 13px; margin-bottom: 8px; }
  textarea { resize: vertical; min-height: 64px; }
  button { background: #232a35; color: #d7dce3; border: 1px solid #333c4a; border-radius: 6px; padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer; margin: 0 8px 8px 0; }
  button:hover:not(:disabled) { border-color: #4a90d9; }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button.primary { background: #1d3a5f; border-color: #2f5d94; }
  button.danger:hover { border-color: #d94a4a; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  label { font-size: 11px; color: #8a93a3; display: block; margin-bottom: 3px; }
  #chat { max-height: 520px; overflow-y: auto; font-size: 12.5px; line-height: 1.65; }
  .msg { margin-bottom: 10px; padding: 8px 10px; border-radius: 6px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { background: #1d3a5f; }
  .msg.assistant { background: #1a2130; border: 1px solid #2a3446; }
  .msg.note { background: #14181f; border-left: 3px solid #e06c6c; color: #b9c0cc; font-size: 12px; }
  .msg.summary { background: #17211a; border-left: 3px solid #6fd38a; color: #b9c0cc; font-size: 12px; }
  .msg.summary summary { cursor: pointer; color: #8fbf9c; }
  .msg.summary .body { padding: 6px 8px; border-left: 2px solid #2c4534; margin-top: 6px; white-space: pre-wrap; }
  .msg .who { font-size: 10px; color: #8a93a3; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 4px; }
  .thinking { margin: 4px 0 8px; font-size: 11.5px; color: #7d8aa0; }
  .thinking summary { cursor: pointer; color: #55607a; }
  .thinking .body { padding: 6px 8px; border-left: 2px solid #333c4a; margin-top: 4px; white-space: pre-wrap; }
  .markdown-body { white-space: normal; overflow-wrap: anywhere; }
  .markdown-body > :first-child { margin-top: 0; }
  .markdown-body > :last-child { margin-bottom: 0; }
  .markdown-body p { margin: .45em 0; }
  .markdown-body h1, .markdown-body h2, .markdown-body h3 { margin: .8em 0 .35em; line-height: 1.35; }
  .markdown-body h1 { font-size: 1.35em; } .markdown-body h2 { font-size: 1.2em; } .markdown-body h3 { font-size: 1.05em; }
  .markdown-body ul, .markdown-body ol { margin: .45em 0; padding-left: 1.6em; }
  .markdown-body blockquote { margin: .6em 0; border-left: 3px solid #333c4a; padding-left: .8em; color: #a8b0bd; }
  .markdown-body pre { overflow: auto; border: 1px solid #2f3743; border-radius: 5px; padding: 8px; background: #10141a; white-space: pre; }
  .markdown-body code { border-radius: 3px; padding: .1em .3em; background: #10141a; }
  .markdown-body pre code { padding: 0; background: transparent; }
  .markdown-body table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; }
  .markdown-body th, .markdown-body td { border: 1px solid #333c4a; padding: 4px 7px; text-align: left; }
  .markdown-body a { color: #78aee8; }
  .toolcall { background: #14181f; border-left: 3px solid #4a90d9; padding: 6px 8px; margin-top: 6px; border-radius: 4px; font-size: 11.5px; color: #9fb6d4; }
  .toolcall .status { float: right; font-size: 10px; color: #8a93a3; }
  .toolcall .status.running { color: #e6c25a; }
  .toolcall .status.done { color: #6fd38a; }
  .toolcall .result { margin-top: 4px; padding-top: 4px; border-top: 1px dashed #262c37; color: #b9c0cc; max-height: 140px; overflow: auto; white-space: pre-wrap; }
  .cursor::after { content: "▍"; color: #4a90d9; animation: blink 1s step-start infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .file { font-size: 12.5px; padding: 3px 6px; border-radius: 4px; cursor: pointer; color: #9fb6d4; }
  .file:hover, .file.active { background: #232a35; color: #d7dce3; }
  .fileview { background: #0f1115; border: 1px solid #262c37; border-radius: 6px; padding: 8px; font-size: 11.5px; max-height: 220px; overflow: auto; white-space: pre-wrap; word-break: break-word; margin-top: 8px; color: #b9c0cc; }
  iframe { width: 100%; height: 320px; border: 1px solid #333c4a; border-radius: 6px; background: #fff; }
  #syslog { max-height: 130px; overflow-y: auto; font-size: 11px; line-height: 1.6; color: #55606f; }
  .ok { color: #6fd38a; } .warn { color: #e6c25a; } .err { color: #e06c6c; }
  .dim { color: #55606f; font-size: 12px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.on { background: #6fd38a; } .dot.off { background: #55606f; }
  code { color: #e6c25a; }
  .plugin-box { border: 1px dashed #333c4a; border-radius: 6px; padding: 10px; margin-bottom: 8px; }
  .plugin-box .pname { font-size: 11px; color: #8a93a3; margin-bottom: 6px; }
  .plugin-error { border: 1px solid #5a2a2a; background: #1f1517; border-radius: 6px; padding: 10px; margin-bottom: 8px; font-size: 12px; color: #e06c6c; }
  .badge { font-size: 10px; padding: 1px 6px; border-radius: 4px; background: #232a35; color: #8a93a3; margin-left: 6px; }
  .badge.hmr { color: #e6c25a; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/entries/standalone/main.ts"></script>
</body>
</html>
