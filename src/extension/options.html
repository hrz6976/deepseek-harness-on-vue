<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harness Page Agent 设置</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main>
      <header class="page-header">
        <div class="brand"><span>H</span>Harness</div>
        <p class="eyebrow">MODEL CONNECTION</p>
        <h1>连接你的模型</h1>
        <p class="lede">使用 DeepSeek 或其他 OpenAI-compatible endpoint。凭据只保存在扩展的可信存储中。</p>
      </header>
      <form id="settings">
        <div class="form-heading">
          <div><strong>API 配置</strong><span>OpenAI-compatible</span></div>
          <span class="secure-badge">Trusted storage</span>
        </div>
        <label><span>Base URL</span><input id="base-url" type="url" required value="https://api.deepseek.com" spellcheck="false" /></label>
        <label><span>Model</span><input id="model" type="text" required value="deepseek-chat" spellcheck="false" /></label>
        <label><span>API Key</span><input id="api-key" type="password" autocomplete="off" placeholder="留空则保留已有 key" /></label>
        <footer>
          <button id="submit" type="submit">保存设置</button>
          <span id="status" role="status" aria-live="polite"></span>
        </footer>
      </form>
      <aside><strong>安全边界</strong><p>Sandbox、宿主页面和动态插件都无法读取 API key。网络请求由 trusted service worker 代为执行。</p></aside>
    </main>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
