<main>
  <header>
    <h1>模型连接</h1>
    <p>管理 OpenAI-compatible Provider；任务中可独立选择 Profile 和模型。</p>
  </header>
  <form @submit.prevent="save">
    <div class="profile-toolbar">
      <label><span>Profile</span><select :value="selectedId" @change="selectProfile($event.target.value)">
        <option v-for="profile in config.profiles" :key="profile.id" :value="profile.id">{{ profile.name || 'Untitled' }}{{ profile.id === config.defaultProfileId ? ' · 默认' : '' }}</option>
      </select></label>
      <div class="profile-actions">
        <button type="button" class="secondary" @click="add('opencode-go')">+ OpenCode Go</button>
        <button type="button" class="secondary" @click="add('custom')">+ Provider</button>
        <button type="button" class="ghost danger" :disabled="config.profiles.length === 1" @click="remove">删除</button>
      </div>
    </div>
    <template v-if="selectedProfile">
      <div class="fields">
        <label><span>名称</span><input v-model="selectedProfile.name" type="text" required autocomplete="off" /></label>
        <label><span>默认模型</span><input v-model="selectedProfile.defaultModel" type="text" required spellcheck="false" placeholder="deepseek-v4-flash" /></label>
        <label class="wide"><span>Base URL</span><input v-model="selectedProfile.baseURL" type="url" required spellcheck="false" /></label>
        <label class="wide"><span>API Key</span><input v-model="draftKeys[selectedId]" type="password" autocomplete="off" :placeholder="selectedProfile.apiKey ? '已有 key；留空则保留' : 'API key（本地 endpoint 可留空）'" /></label>
      </div>
      <div class="profile-meta">
        <label class="check-row"><input type="checkbox" :checked="selectedId === config.defaultProfileId" @change="makeDefault" /><span>默认 Profile</span></label>
        <p>{{ selectedProfile.id === 'opencode-go' ? 'OpenCode Go · Chat Completions' : '任务可单独选择此 Profile 和模型' }}</p>
      </div>
    </template>
    <footer>
      <button type="submit" :disabled="saving">{{ saving ? '保存中…' : '保存' }}</button>
      <span role="status" aria-live="polite" :data-state="statusState">{{ status }}</span>
    </footer>
  </form>
  <p class="security">API Key 仅保存在扩展可信存储中，不会暴露给页面或插件。</p>
</main>
